    params: 35B total, 3B active (MoE)
    backbone_of: [decider-35b-a3b]
    dir: models/qwen3.5-35b-a3b
    file: Qwen3.5-35B-A3B-Q4_K_M.gguf
    sha256: 3b46d1066bc91cc2d613e3bc22ce691dd77e6f0d33c9060690d24ce6de494375
    port: 8209
    conditions:
      think:   {template: {enable_thinking: true},  sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5}}
      nothink: {template: {enable_thinking: false}, sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, presence_penalty: 1.5}}
